<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Shield/Square -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" />

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#gold)" stroke-width="8" stroke-dasharray="8 6" opacity="0.4" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="#10b981" stroke-width="3" opacity="0.6" />

  <!-- Registry Folder / Document Icon -->
  <g filter="url(#shadow)">
    <!-- Document 1 (Back) -->
    <rect x="156" y="120" width="180" height="240" rx="16" fill="#0f766e" opacity="0.7" />
    <!-- Document 2 (Main front) -->
    <rect x="176" y="140" width="180" height="240" rx="16" fill="#ffffff" />
    
    <!-- Header of Document -->
    <rect x="200" y="165" width="132" height="14" rx="7" fill="#064e3b" />
    <rect x="200" y="190" width="90" height="10" rx="5" fill="#10b981" />
    
    <!-- Document Lines -->
    <rect x="200" y="220" width="132" height="8" rx="4" fill="#cbd5e1" />
    <rect x="200" y="240" width="110" height="8" rx="4" fill="#cbd5e1" />
    <rect x="200" y="260" width="125" height="8" rx="4" fill="#cbd5e1" />
    <rect x="200" y="280" width="85" height="8" rx="4" fill="#cbd5e1" />
  </g>

  <!-- Medical Cross / Badge on bottom right -->
  <g transform="translate(290, 280)" filter="url(#shadow)">
    <circle cx="60" cy="60" r="54" fill="#047857" stroke="#ffffff" stroke-width="6" />
    <!-- Red Crescent or Medical Cross -->
    <rect x="52" y="32" width="16" height="56" rx="8" fill="#ffffff" />
    <rect x="32" y="52" width="56" height="16" rx="8" fill="#ffffff" />
  </g>

  <!-- Quill / Stamp Icon on left -->
  <g transform="translate(130, 290)">
    <circle cx="45" cy="45" r="42" fill="url(#gold)" stroke="#ffffff" stroke-width="4" />
    <path d="M35 55 L55 35 L62 42 L42 62 Z" fill="#78350f" />
    <polygon points="32,58 35,55 42,62 30,68" fill="#ffffff" />
  </g>

  <!-- Office Badge Banner -->
  <rect x="106" y="405" width="300" height="48" rx="24" fill="#064e3b" stroke="url(#gold)" stroke-width="3" />
  <text x="256" y="437" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="22" fill="#ffffff">
    مكتب صحة سفلاق
  </text>
</svg>
